services:
  app:
    build:
      context: .
      args:
        PHP_VERSION: 7.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: xgp
      DB_USERNAME: root
      DB_PASSWORD: root
    expose:
      - "80"
    command: sh -c "composer install --no-interaction --prefer-dist && apache2-foreground"

  db:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: xgp
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
