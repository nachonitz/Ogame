version: "3.8"

services:
  app:
    build:
      context: .
      args:
        PHP_VERSION: 7.4

    restart: unless-stopped

    volumes:
      - .:/var/www/html

    depends_on:
      - db

    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: xgp
      DB_USERNAME: root
      DB_PASSWORD: root

  db:
    image: mysql:5.7

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: xgp
      MYSQL_ROOT_PASSWORD: root

    command: --default-authentication-plugin=mysql_native_password

    volumes:
      - mysql_data:/var/lib/mysql
      - ./data:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin/phpmyadmin

    restart: unless-stopped

    depends_on:
      - db

    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root

  mailhog:
    image: mailhog/mailhog

    restart: unless-stopped

volumes:
  mysql_data:
